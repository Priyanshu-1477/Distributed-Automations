services:
  postgres:
    image: postgres:16-alpine
    container_name: dap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dap_network

  redis:
    image: redis:7-alpine
    container_name: dap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dap_network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dap_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/automation_db
      - DATABASE_SYNC_URL=postgresql+psycopg://postgres:postgres@postgres:5432/automation_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dap_network

volumes:
  postgres_data:
    driver: local

networks:
  dap_network:
    driver: bridge

